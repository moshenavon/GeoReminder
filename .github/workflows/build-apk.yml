name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: set -o pipefail; gradle :app:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: GeoAlert-v2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
